<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murder Mystery Night</title>
    <style>
        /* 
         * NOTION-STYLE AESTHETIC & GLASSMORPHISM
         */
        :root {
            --bg-color: #f7f7f5;
            --text-main: #37352f;
            --text-muted: rgba(55, 53, 47, 0.6);
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.3);
            --accent: #2eaadc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Canvas Background */
        #rain-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0; /* Fixed: Moved above the body background */
            pointer-events: none;
        }

        /* Main Container */
        #app {
            position: relative;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            z-index: 10; /* Fixed: Keeps the interactive box above the canvas */
        }

        .glass-box {
            width: 100%;
            max-width: 650px; 
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 50px 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        /* Typography */
        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1.title {
            font-size: 2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -0.05em; 
            margin-bottom: 0px; 
            line-height: 1.1;
        }

        p.subtitle {
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: -0.02em; 
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
            border-bottom: 1px solid rgba(55, 53, 47, 0.1);
            padding-bottom: 15px;
        }

        nav button {
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
            font-family: inherit;
        }

        nav button:hover {
            color: var(--text-main);
        }

        nav button.active {
            color: var(--text-main);
            font-weight: 700;
        }

        /* Content Sections */
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Character Directory Styles */
        .department-group {
            margin-bottom: 30px;
        }

        .department-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(55, 53, 47, 0.1);
            padding-bottom: 4px;
        }

        .character-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            cursor: pointer;
            transition: transform 0.1s;
            border-radius: 4px;
        }

        .character-item:hover {
            background: rgba(55, 53, 47, 0.05);
            padding-left: 8px;
            padding-right: 8px;
            margin-left: -8px;
            margin-right: -8px;
        }

        .char-info {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .char-name {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .char-role {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .char-arrow {
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        /* Password Modal */
        #password-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            border-radius: 12px;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10;
        }

        #password-overlay.active {
            display: flex;
        }

        .pwd-input {
            padding: 10px 15px;
            border: 1px solid rgba(55, 53, 47, 0.2);
            border-radius: 6px;
            font-family: inherit;
            font-size: 1rem;
            margin-top: 15px;
            margin-bottom: 10px;
            width: 80%;
            max-width: 250px;
            background: rgba(255,255,255,0.9);
        }

        .pwd-btn {
            padding: 8px 16px;
            background: var(--text-main);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Markdown Profile Styles */
        .profile-view {
            display: none;
        }
        
        .profile-view.active {
            display: block;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .back-btn:hover {
            color: var(--text-main);
        }

        .md-content h1 { font-size: 1.8rem; margin-bottom: 10px; letter-spacing: -0.03em; }
        .md-content h2 { font-size: 1.4rem; margin-top: 25px; margin-bottom: 10px; border-bottom: 1px solid rgba(55,53,47,0.1); padding-bottom: 5px;}
        .md-content h3 { font-size: 1.1rem; margin-top: 20px; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;}
        .md-content p { margin-bottom: 15px; line-height: 1.6; }
        .md-content ul { margin-left: 20px; margin-bottom: 15px; line-height: 1.6; }
        .md-content li { margin-bottom: 6px; }
        .md-content strong { font-weight: 700; }
        .md-content mark { background-color: #ffd966; padding: 0 4px; border-radius: 2px; }
        .md-content hr { border: 0; height: 1px; background: rgba(55,53,47,0.1); margin: 20px 0; }
        .md-content code { background: rgba(55,53,47,0.05); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 0.9em;}
    </style>
</head>
<body>

    <canvas id="rain-canvas"></canvas>

    <div id="app">
        <div class="glass-box" id="main-card">
            
            <div id="password-overlay">
                <h3 id="pwd-character-name">Character Name</h3>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 5px;">Enter authorization key</p>
                <input type="password" id="pwd-input" class="pwd-input" placeholder="Password...">
                <button class="pwd-btn" onclick="checkPassword()">Access File</button>
                <button class="back-btn" style="margin-top: 15px;" onclick="closePassword()">Cancel</button>
                <p id="pwd-error" style="color: #e03e3e; font-size: 0.85rem; margin-top: 10px; display: none;">Access denied.</p>
            </div>

            <div id="standard-view">
                <header>
                    <h1 class="title">Murder Mysteyr Night</h1>
                    <p class="subtitle">10 October 2026</p>
                </header>

                <nav>
                    <button class="active" onclick="switchTab('characters')">Characters</button>
                    <button onclick="switchTab('menu')">Menu</button>
                    <button onclick="switchTab('evidence')">Evidence</button>
                </nav>

                <div id="characters" class="tab-content active">
                    <!-- Directory generated via JS -->
                </div>

                <div id="menu" class="tab-content">
                    <div class="md-content">
                        <h2>Menu</h2>
                        <p>Food and beverage details will be displayed here.</p>
                    </div>
                </div>

                <div id="evidence" class="tab-content">
                    <div class="md-content">
                        <h2>Evidence Locker</h2>
                        <p>Publicly available evidence items will appear here as the night progresses.</p>
                    </div>
                </div>
            </div>

            <div id="profile-view" class="profile-view">
                <button class="back-btn" onclick="backToDirectory()">← Back to Directory</button>
                <div id="profile-content" class="md-content">
                    <!-- Markdown injected here -->
                </div>
            </div>

        </div>
    </div>

    <script type="text/markdown" id="raw-markdown-data">
# 01 — Max Ledger
**Player:** Josh
**Group Strategy Director**
Ambitious · Persuasive · Competitive
You shape Vantage's big deals, growth plans and corporate strategy.
**Cash:** £500,000  
**Votes:** 0  
**CEO eligible:** Yes
---
## Tonight
Win the CEO job, stop the reporting scandal from swallowing you, and work out who actually killed Julian.
## What you know
You knowingly pushed aggressive interpretations, optimistic numbers and exceptions to normal controls when they got in the way of growth. You told yourself the business was fundamentally strong and the problems could be cleaned up later. That judgement could now destroy your CEO campaign.
- At about 16:30 you caught the end of a tense argument between Julian and Cole. You clearly heard Julian tell Cole: **“You signed it.”**
- Julian had become seriously worried about Vantage’s reporting and was considering stopping or suspending Helix.
- <mark>You were not involved in Julian’s homicide.</mark>

**Player:** Helen
**Chief of Staff**
Controlled · Brilliant · Political
You ran Julian’s diary, executive logistics and much of the machinery around him.
**Cash:** £150,000  
**Votes:** 0  
**CEO eligible:** No
---
## What really happened
**Cole planned Julian’s murder and you knowingly helped him.** Cole arranged a counterfeit Neraval. At about **16:58** you used your legitimate access to replace Julian’s genuine device with it.
- Your messages with Cole used **“pizza”** as a euphemism.
- <mark>You physically performed the swap; Cole did not.</mark>
- You and Perry officially entered the Founder Office at about **17:34** and found Julian dead.

# 03 — Polly Tician
**Player:** Sara Brimble
**Government Affairs / Lobbying**
Polished · Persuasive · Politically connected
**Cash:** £250,000  
---
## What really happened
At about **16:40**, you deliberately put fictional **Aster-9** into Julian’s champagne **intending to kill him**. Julian drank it. He is now dead.
- <mark>You did not coordinate your attempt with another player.</mark>

# 04 — Sally Short
**Player:** Jennifer Hien
**Activist Short-Seller & Investigator**
Sharp · Sceptical · Opportunistic
---
## What really happened
At about **17:17** you secretly entered Julian’s private office area. At about **17:18** you found him collapsed and unresponsive and <mark>assumed he was dead</mark>. You stole his USB `JV-01`.

# 05 — Opal Ration
**Player:** Ope
**Operations & Special Projects**
Practical · Discreet · Opportunistic
---
## What really happened
At about **16:55** you deliberately triggered the security-visibility disruption so you could copy Helix material for Vince.
- <mark>You did not know the blackout would be exploited for murder.</mark>
    </script>

    <script>
        /* 
         * 1. RAINING £ CANVAS EFFECT
         */
        (function initCanvas() {
            const canvas = document.getElementById('rain-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let symbols = [];

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize(); 

            class Symbol {
                constructor() {
                    this.reset(true);
                }
                reset(initial = false) {
                    this.x = Math.random() * width;
                    this.y = initial ? Math.random() * height : -20;
                    this.size = Math.random() * 10 + 10; 
                    this.speed = Math.random() * 1.5 + 0.5; 
                    this.opacity = Math.random() * 0.5 + 0.3; 
                }
                update() {
                    this.y += this.speed;
                    if (this.y > height + 20) {
                        this.reset();
                    }
                }
                draw() {
                    ctx.fillStyle = `rgba(0, 0, 0, ${this.opacity})`;
                    ctx.font = `${this.size}px sans-serif`;
                    ctx.fillText('£', this.x, this.y);
                }
            }

            const density = Math.floor(window.innerWidth / 15);
            for (let i = 0; i < density; i++) {
                symbols.push(new Symbol());
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                symbols.forEach(symbol => {
                    symbol.update();
                    symbol.draw();
                });
                requestAnimationFrame(animate);
            }
            animate();
        })();

        /*
         * 2. DIRECTORY STRUCTURE & PASSWORDS
         */
        const directoryStructure = [
            {
                department: "Executive & Company Leadership",
                members: [
                    { name: "Max Ledger", role: "Group Strategy Director" },
                    { name: "Rita Distribution", role: "Chief of Staff" },
                    { name: "Opal Ration", role: "Operations & Special Projects" },
                    { name: "Perry Spin", role: "Crisis Communications / Public Affairs" },
                    { name: "Polly Tician", role: "Government Affairs / Lobbying" },
                    { name: "Alec Cation", role: "People & Organisational Strategy" }
                ]
            },
            {
                department: "Governance, Risk & Control",
                members: [
                    { name: "Cole Control", role: "Chair of Audit & Risk" },
                    { name: "Phil McCracken", role: "Chief Information Security Officer" },
                    { name: "Al Gorithm", role: "Quant & Systems Architect" },
                    { name: "Vera Iance", role: "Risk Modelling" },
                    { name: "Audie Trail", role: "Internal Audit" },
                    { name: "Clara Clause", role: "M&A Lawyer" }
                ]
            },
            {
                department: "Research, Investigation & Records",
                members: [
                    { name: "Reese Search", role: "Junior Research Analyst" },
                    { name: "Drew Diligence", role: "Helix Due-Diligence Associate" },
                    { name: "Finn Dings", role: "Special Investigations Adviser" },
                    { name: "Archie Vist", role: "Records & Archives Coordinator" }
                ]
            },
            {
                department: "Board, Shareholders & Capital",
                members: [
                    { name: "Hugh Stake", role: "Cornerstone Investor" },
                    { name: "Penny Sterling", role: "Legacy Shareholder" },
                    { name: "Lee Verage", role: "Private Equity Partner / Board Director" },
                    { name: "Cass Flow", role: "Hedge Fund Investor" },
                    { name: "Fran de Fonds", role: "Family Office / Shareholder" },
                    { name: "Cal Lateral", role: "Private Banker / Non-Executive Director" },
                    { name: "Vince Ture", role: "Crypto Founder / Venture Capitalist" },
                    { name: "Arby Trage", role: "Special Situations Investor & Restructuring Adviser" }
                ]
            },
            {
                department: "Intelligence & Outside Pressure",
                members: [
                    { name: "Lucy Leaks", role: "Corporate Intelligence Adviser" },
                    { name: "Gus Sip", role: "Executive Reputation Broker" },
                    { name: "Sally Short", role: "Activist Short-Seller & Investigator" }
                ]
            }
        ];

        const passwords = {};
        directoryStructure.forEach(dept => {
            dept.members.forEach(member => {
                const firstName = member.name.split(' ')[0].toLowerCase();
                passwords[member.name] = firstName; 
            });
        });

        /*
         * 3. MARKDOWN PARSER & DATA EXTRACTOR
         */
        const rawMarkdown = document.getElementById('raw-markdown-data').textContent;
        const characterDataMap = {}; 

        function parseMarkdown(md) {
            let html = md;
            html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
            html = html.replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>');
            html = html.replace(/`(.*?)`/gim, '<code>$1</code>');
            html = html.replace(/<mark>(.*?)<\/mark>/gim, '<mark>$1</mark>');
            html = html.replace(/^\- (.*$)/gim, '<ul><li>$1</li></ul>');
            html = html.replace(/<\/ul>\n<ul>/gim, '\n'); 
            html = html.replace(/^---/gim, '<hr>');
            html = html.replace(/\n\n/gim, '<br><br>');
            return html;
        }

        const sections = rawMarkdown.split(/# \d{2} — /);
        sections.forEach(section => {
            if (section.trim() === '') return;
            const lines = section.trim().split('\n');
            const name = lines[0].trim(); 
            const content = section.substring(lines[0].length).trim();
            characterDataMap[name] = parseMarkdown(content);
        });

        /*
         * 4. APP LOGIC (UI & Transitions)
         */
        let currentTargetCharacter = "";

        const charContainer = document.getElementById('characters');
        directoryStructure.forEach(dept => {
            const deptDiv = document.createElement('div');
            deptDiv.className = 'department-group';
            
            const title = document.createElement('div');
            title.className = 'department-title';
            title.textContent = dept.department;
            deptDiv.appendChild(title);

            dept.members.forEach(member => {
                const item = document.createElement('div');
                item.className = 'character-item';
                item.onclick = () => openPassword(member.name);
                
                item.innerHTML = `
                    <div class="char-info">
                        <span class="char-name">${member.name}</span>
                        <span class="char-role">${member.role}</span>
                    </div>
                    <div class="char-arrow">→</div>
                `;
                deptDiv.appendChild(item);
            });
            charContainer.appendChild(deptDiv);
        });

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        function openPassword(characterName) {
            currentTargetCharacter = characterName;
            document.getElementById('pwd-character-name').textContent = characterName;
            document.getElementById('pwd-input').value = '';
            document.getElementById('pwd-error').style.display = 'none';
            document.getElementById('password-overlay').classList.add('active');
            document.getElementById('pwd-input').focus();
        }

        function closePassword() {
            document.getElementById('password-overlay').classList.remove('active');
            currentTargetCharacter = "";
        }

        function checkPassword() {
            const input = document.getElementById('pwd-input').value.trim().toLowerCase();
            const correctPwd = passwords[currentTargetCharacter];

            if (input === correctPwd) {
                closePassword();
                showProfile(currentTargetCharacter);
            } else {
                document.getElementById('pwd-error').style.display = 'block';
            }
        }

        document.getElementById('pwd-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        function showProfile(characterName) {
            document.getElementById('standard-view').style.display = 'none';
            const profileView = document.getElementById('profile-view');
            const profileContent = document.getElementById('profile-content');
            
            let contentHTML = characterDataMap[characterName];
            if (!contentHTML) {
                contentHTML = `<h1>${characterName}</h1><p>Profile data not found in system.</p>`;
            }

            profileContent.innerHTML = contentHTML;
            profileView.classList.add('active');
        }

        function backToDirectory() {
            document.getElementById('profile-view').classList.remove('active');
            document.getElementById('standard-view').style.display = 'block';
        }
    </script>
</body>
</html>
